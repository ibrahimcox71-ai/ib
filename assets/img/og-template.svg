<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OG IMAGE TEMPLATE (1200×630)
       Export to PNG as /assets/img/og-image.png:
       open this file in a browser → screenshot, or use a tool like
       npx playwright / Inkscape / Figma. Replace text per page if desired. -->
  <defs>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2a93b"/>
      <stop offset="1" stop-color="#ffc96a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.12" r="0.9">
      <stop offset="0" stop-color="#f2a93b" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#f2a93b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.05" cy="1" r="0.8">
      <stop offset="0" stop-color="#8ea0c2" stop-opacity="0.16"/>
      <stop offset="0.6" stop-color="#8ea0c2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#94a3b8" opacity="0.25"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#0a0b0f"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>
  <rect x="760" y="40" width="400" height="330" fill="url(#dots)"/>
  <rect x="40" y="330" width="330" height="260" fill="url(#dots)" opacity="0.5"/>

  <!-- Wireframe accents -->
  <g fill="none" stroke="#f2a93b" stroke-width="1.4" opacity="0.5">
    <circle cx="1050" cy="470" r="90"/>
    <rect x="990" y="410" width="120" height="120" transform="rotate(18 1050 470)"/>
  </g>
  <g fill="none" stroke="#8ea0c2" stroke-width="1.4" opacity="0.45">
    <polygon points="160,80 210,155 110,155"/>
  </g>

  <!-- Eyebrow -->
  <text x="110" y="218" font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif" font-weight="600"
        font-size="26" letter-spacing="7" fill="#f2a93b">IBRAHIM KHAN</text>

  <!-- Headline -->
  <text x="105" y="310" font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif" font-weight="700"
        font-size="64" fill="#eef1f7" letter-spacing="-1">
    <tspan x="105" dy="0">I build high-converting websites</tspan>
    <tspan x="105" dy="78">and email campaigns that</tspan>
    <tspan x="105" dy="78">grow your <tspan fill="url(#amber)">sales.</tspan></tspan>
  </text>

  <!-- Subline -->
  <text x="107" y="545" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-weight="500"
        font-size="25" fill="#a0a9ba">Full-Stack Web Developer &amp; Email Marketing Expert · imibrahimkhan.com</text>

  <!-- Badge -->
  <g transform="translate(1080 90)">
    <rect x="-52" y="-52" width="104" height="104" rx="24" fill="none" stroke="url(#amber)" stroke-width="2"/>
    <text y="16" text-anchor="middle" font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif"
          font-weight="700" font-size="44" fill="url(#amber)">IK</text>
  </g>
</svg>
